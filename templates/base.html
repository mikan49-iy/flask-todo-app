<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous">
    
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <nav class="navbar sticky-top bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        {% if current_user.is_authenticated %}
          <a class="navbar-brand" href="{{ url_for('tasks') }}">ToDo管理</a>
          <form action="{{ url_for('logout') }}" method="POST" class="d-flex">
            <button class="btn btn-outline-light" type="submit">ログアウト</button>
          </form>
        {% else %}
          <span class="navbar-brand mb-0 h1">ToDo管理</span>
        {% endif %}
      </div>
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
