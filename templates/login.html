{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow auth-card" >  
      <h2 class="text-center mb-4">ログイン</h2>

      {% if error %}
        <div class="alert alert-danger">
          {{ error }}
        </div>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">メールアドレス</label>
          <input type="email" maxlength="255" name="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">パスワード</label>
          <input type="password" name="password" id="password" class="form-control" required />
        </div>
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">ログイン</button>
        </div>
      </form>

      <p class="text-center mt-3 mb-0">
        アカウントをお持ちでない方は<a href="{{ url_for('register') }}" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">こちら</a>
      </p>
    </div>
  </div>
{% endblock %}
