{% extends "base.html" %}

{% block title %}ユーザー新規登録{% endblock %}

{% block content %}
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow auth-card">
      <h2 class="text-center mb-4">ユーザー新規登録</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('register') }}" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">メールアドレス</label>
          <input type="email" value="{{ form_data.email }}" maxlength="255" name="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password1" class="form-label">パスワード</label>
          <input type="password" name="password1" id="password1" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password2" class="form-label">パスワード（確認）</label>
          <input type="password" name="password2" id="password2" class="form-control" required />
        </div>
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">登録する</button>
        </div>
      </form>

      <p class="text-center mt-3 mb-0">
        すでにアカウントをお持ちの方は<a href="{{ url_for('login') }}" class="link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">こちら</a>
      </p>
    </div>
  </div> 
{% endblock %}
